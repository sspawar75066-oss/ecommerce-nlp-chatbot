<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E-commerce NLP Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0e7ff, #f8fafc);
            color: #1e293b;
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.1);
        }

        .card h2 {
            color: #1e3a8a;
            margin-bottom: 18px;
        }

        .chat-box {
            min-height: 320px;
            max-height: 420px;
            overflow-y: auto;
            padding: 12px;
            background: #f8fafc;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .message {
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            max-width: 85%;
            line-height: 1.5;
        }

        .user-message {
            background: #2563eb;
            color: white;
            margin-left: auto;
        }

        .bot-message {
            background: #e2e8f0;
            color: #1e293b;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            resize: none;
            height: 60px;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        textarea:focus {
            border-color: #2563eb;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 0 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }

        .analysis-item {
            margin-bottom: 18px;
        }

        .analysis-label {
            display: block;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .analysis-value {
            background: #f1f5f9;
            padding: 11px;
            border-radius: 9px;
            word-wrap: break-word;
        }

        .intent {
            color: #1d4ed8;
            font-size: 19px;
            font-weight: bold;
        }

        .confidence-bar {
            width: 100%;
            height: 12px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #14b8a6);
            transition: width 0.5s ease;
        }

        .keyword {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 6px 9px;
            border-radius: 20px;
            margin: 3px;
            font-size: 13px;
        }

        .token {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 5px 8px;
            border-radius: 16px;
            margin: 3px;
            font-size: 13px;
        }

        .empty {
            color: #94a3b8;
            text-align: center;
            padding: 40px 10px;
        }

        .error {
            color: #b91c1c;
            background: #fee2e2;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }

        @media (max-width: 850px) {
            body {
                padding: 15px;
            }

            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>🛒 E-commerce NLP Customer Support Chatbot</h1>
            <p>Intent classification, tokenization, keyword extraction, and entity detection</p>
        </div>

        <div class="main-grid">

            <div class="card">
                <h2>Chat with Support Bot</h2>

                <div id="chatBox" class="chat-box">
                    <div class="bot-message message">
                        Hello! I can help with order tracking, returns, failed payments, and refunds.
                    </div>
                </div>

                <div class="input-area">
                    <textarea
                        id="messageInput"
                        placeholder="Example: Where is my order ORD12345?"
                    ></textarea>

                    <button onclick="sendMessage()">Send</button>
                </div>

                <div id="errorBox"></div>
            </div>

            <div class="card">
                <h2>NLP Analysis Dashboard</h2>

                <div id="dashboard">
                    <div class="empty">
                        Send a message to view NLP analysis.
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/chat";

        async function sendMessage() {
            const input = document.getElementById("messageInput");
            const message = input.value.trim();
            const errorBox = document.getElementById("errorBox");

            if (!message) {
                return;
            }

            addMessage(message, "user-message");
            input.value = "";
            errorBox.innerHTML = "";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Request failed");
                }

                addMessage(data.bot_response, "bot-message");
                updateDashboard(data);

            } catch (error) {
                errorBox.innerHTML = `
                    <div class="error">
                        Could not connect to the backend. Make sure Uvicorn is running.
                    </div>
                `;
            }
        }

        function addMessage(text, className) {
            const chatBox = document.getElementById("chatBox");

            const messageElement = document.createElement("div");
            messageElement.className = `message ${className}`;
            messageElement.textContent = text;

            chatBox.appendChild(messageElement);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function updateDashboard(data) {
            const dashboard = document.getElementById("dashboard");

            const tokens = data.tokens
                .map(token => `<span class="token">${token}</span>`)
                .join("");

            const keywords = data.important_keywords.length > 0
                ? data.important_keywords
                    .map(keyword => `<span class="keyword">${keyword}</span>`)
                    .join("")
                : "No matching important keywords found.";

            const entities = `
                <strong>Order IDs:</strong> ${data.entities.order_ids.join(", ") || "None"}<br>
                <strong>Payment IDs:</strong> ${data.entities.payment_ids.join(", ") || "None"}<br>
                <strong>Amounts:</strong> ${data.entities.amounts.join(", ") || "None"}
            `;

            dashboard.innerHTML = `
                <div class="analysis-item">
                    <span class="analysis-label">Predicted Intent</span>
                    <div class="analysis-value intent">
                        ${data.predicted_intent}
                    </div>
                </div>

                <div class="analysis-item">
                    <span class="analysis-label">
                        Confidence: ${data.confidence_percentage}%
                    </span>

                    <div class="confidence-bar">
                        <div
                            class="confidence-fill"
                            style="width: ${data.confidence_percentage}%"
                        ></div>
                    </div>
                </div>

                <div class="analysis-item">
                    <span class="analysis-label">Tokens (${data.token_count})</span>
                    <div class="analysis-value">
                        ${tokens}
                    </div>
                </div>

                <div class="analysis-item">
                    <span class="analysis-label">Important Keywords</span>
                    <div class="analysis-value">
                        ${keywords}
                    </div>
                </div>

                <div class="analysis-item">
                    <span class="analysis-label">Extracted Entities</span>
                    <div class="analysis-value">
                        ${entities}
                    </div>
                </div>

                <div class="analysis-item">
                    <span class="analysis-label">Character Count</span>
                    <div class="analysis-value">
                        ${data.character_count}
                    </div>
                </div>
            `;
        }

        document
            .getElementById("messageInput")
            .addEventListener("keydown", function(event) {
                if (event.key === "Enter" && !event.shiftKey) {
                    event.preventDefault();
                    sendMessage();
                }
            });
    </script>

</body>
</html>
